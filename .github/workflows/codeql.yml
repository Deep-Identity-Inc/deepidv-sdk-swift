name: CodeQL

# Advanced CodeQL setup. The default setup's autobuild runs a plain macOS
# `swift build`, which can't compile this iOS-only package, so Swift is built
# here the same way CI builds it: xcodebuild for the iOS Simulator.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual
            runner: macos-26
          - language: actions
            build-mode: none
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        if: matrix.language == 'swift'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build for iOS Simulator
        if: matrix.build-mode == 'manual'
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme DeepIDV \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
