name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # The package is iOS-only, so it builds and tests on a simulator. Pick the
      # first available iPhone rather than hard-coding a model the runner image
      # may not ship.
      - name: Test
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          xcodebuild test \
            -scheme DeepIDV \
            -destination "id=$DEVICE_ID"

      # Host apps must be told to handle enum cases added in later releases:
      # a client switch without `@unknown default` has to fail to compile.
      - name: Check public enums are non-exhaustive
        run: .github/checks/check-nonexhaustive.sh
